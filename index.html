<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="description" content="不二岩普（南宁）：武夷正岩岩茶。" />
    <link rel="icon" href="data:," />
    <title>不二岩普</title>
<style>
      :root {
        --bg: #120c06;
        --panel: #171009;
        --panel-edge: #2a2013;
        --ivory: #f2ead8;
        --ivory-dim: #cfc4ab;
        --muted: #9b8d72;
        --gold: #d9b878;
        --gold-dim: #a8894f;
        --seal: #b03a2a;
        --hairline: rgba(217, 184, 120, 0.22);
        --hairline-soft: rgba(217, 184, 120, 0.13);
      }
      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        background:
          radial-gradient(120% 60% at 50% -10%, #241708 0%, rgba(36, 23, 8, 0) 60%),
          var(--bg);
        color: var(--ivory);
        font-family: "Songti SC", "STSong", "SimSun", serif;
        -webkit-font-smoothing: antialiased;
        padding: clamp(10px, 3vw, 28px) clamp(10px, 3vw, 24px) clamp(28px, 6vw, 48px);
      }
      .sheet {
        max-width: 680px;
        margin: 0 auto;
        background: var(--panel);
        border: 1px solid var(--gold-dim);
        outline: 1px solid var(--panel-edge);
        outline-offset: 5px;
        padding: clamp(28px, 7vw, 56px) clamp(20px, 6vw, 52px) clamp(24px, 6vw, 44px);
      }

      /* ---------- Header ---------- */
      header { text-align: center; }
      .brand {
        font-size: clamp(30px, 8vw, 42px);
        font-weight: 600;
        letter-spacing: 0.42em;
        text-indent: 0.42em;
        margin: 0;
        color: var(--ivory);
      }
      .brand-rule {
        border: none;
        border-top: 1px solid var(--gold);
        margin: clamp(20px, 5vw, 30px) auto clamp(18px, 4.5vw, 26px);
        width: 88%;
      }
      .menu-title {
        font-size: clamp(26px, 7vw, 36px);
        font-weight: 700;
        letter-spacing: 0.5em;
        text-indent: 0.5em;
        margin: 0;
      }
      .menu-sub {
        margin: 10px 0 0;
        font-size: 14px;
        letter-spacing: 0.28em;
        text-indent: 0.28em;
        color: var(--muted);
      }

      /* ---------- Quick nav ---------- */
      nav.quick {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 8px;
        margin: clamp(22px, 5vw, 30px) 0 4px;
      }
      nav.quick a {
        color: var(--ivory-dim);
        text-decoration: none;
        font-size: 13.5px;
        letter-spacing: 0.12em;
        border: 1px solid var(--hairline);
        padding: 6px 13px;
        border-radius: 999px;
      }
      nav.quick a:active { border-color: var(--gold); color: var(--gold); }
      @media (hover: hover) {
        nav.quick a:hover { border-color: var(--gold); color: var(--gold); }
      }

      /* ---------- Sections ---------- */
      section { margin-top: clamp(26px, 6vw, 38px); scroll-margin-top: 16px; }
      .sec-head {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 0 0 6px;
      }
      .seal {
        flex: none;
        width: 17px;
        height: 17px;
        background: var(--seal);
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.18);
      }
      .sec-head h2 {
        font-size: clamp(19px, 5vw, 22px);
        font-weight: 700;
        letter-spacing: 0.14em;
        margin: 0;
        white-space: nowrap;
      }
      .sec-head::after {
        content: "";
        flex: 1;
        border-top: 1px solid var(--hairline);
      }

      /* ---------- Tea rows ---------- */
      ul.teas { list-style: none; margin: 0; padding: 0; }
      ul.teas li {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 16px;
        padding: 13px 2px 11px;
        border-bottom: 1px solid var(--hairline-soft);
      }
      .tea-name {
        font-size: clamp(17px, 4.8vw, 20px);
        font-weight: 500;
        letter-spacing: 0.06em;
      }
      .tea-price {
        font-size: clamp(16px, 4.6vw, 19px);
        color: var(--gold);
        letter-spacing: 0.04em;
        white-space: nowrap;
      }
      .tea-price .unit { font-size: 0.82em; color: var(--gold-dim); }

      /* ---------- Packages ---------- */
      ul.packs { list-style: none; margin: 0; padding: 0; }
      ul.packs li {
        padding: 14px 2px 12px;
        border-bottom: 1px solid var(--hairline-soft);
      }
      .pack-top {
        display: flex;
        align-items: baseline;
        flex-wrap: wrap;
        gap: 6px 18px;
      }
      .pack-name {
        font-size: clamp(17px, 4.8vw, 20px);
        font-weight: 500;
        letter-spacing: 0.06em;
      }
      .pack-price {
        font-size: clamp(16px, 4.6vw, 19px);
        color: var(--gold);
        letter-spacing: 0.04em;
      }
      .pack-price .dot { color: var(--gold-dim); margin: 0 2px; }
      .pack-detail {
        margin: 6px 0 0;
        font-size: 14.5px;
        line-height: 1.7;
        color: var(--ivory-dim);
        letter-spacing: 0.04em;
      }

      /* ---------- Footer ---------- */
      footer {
        margin-top: clamp(26px, 6vw, 36px);
        text-align: center;
      }
      .foot-note {
        font-size: 14px;
        letter-spacing: 0.18em;
        color: var(--muted);
        margin: 0;
      }
      .foot-brand {
        margin: 18px 0 0;
        font-size: 13px;
        letter-spacing: 0.34em;
        text-indent: 0.34em;
        color: var(--gold-dim);
      }


      /* ---------- Logo / gallery ---------- */
      .logo-card { background: #f2ead8; padding: 18px 18px 10px; margin: 0 auto clamp(16px,4vw,24px); max-width: 420px; }
      .logo-card img { width: 100%; height: auto; display: block; }
      .shop-line { text-align: center; margin: 12px 0 0; font-size: 14px; letter-spacing: 0.28em; text-indent: 0.28em; color: var(--muted); }
      .gallery { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; }
      .gallery figure { margin: 0; }
      .gallery img { width: 100%; height: auto; display: block; border: 1px solid var(--panel-edge); }
      .gallery figcaption { font-size: 13px; color: var(--muted); letter-spacing: 0.12em; margin-top: 6px; text-align: center; }
      @media (max-width: 520px) { .gallery { grid-template-columns: 1fr 1fr; gap: 10px; } }

      @media (prefers-reduced-motion: reduce) {
        html { scroll-behavior: auto; }
      }
    </style>
<style>
  nav.chan { display: flex; gap: 8px; justify-content: center; margin: clamp(20px,5vw,28px) 0 4px; flex-wrap: wrap; }
  nav.chan a { color: var(--ivory-dim); text-decoration: none; font-size: 15px; letter-spacing: 0.2em; border: 1px solid var(--hairline); padding: 9px 20px; border-radius: 999px; }
  nav.chan a.on { color: var(--gold); border-color: var(--gold); }
  .hero img { width: 100%; height: auto; display: block; border: 1px solid var(--panel-edge); }
  .hero figcaption { font-size: 13px; color: var(--muted); letter-spacing: 0.12em; margin-top: 6px; text-align: center; }
  .page-title { font-size: clamp(26px,7vw,36px); font-weight: 700; letter-spacing: 0.5em; text-indent: 0.5em; margin: 0; text-align: center; }
</style>
